[project]
name = "ranqia-workspace"
version = "0.1.0"
description = "ranqialabs dev workspace template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    # Direct because bridge.agent.spend prices a run against it. It arrives
    # transitively through pydantic-ai too, and depending on that is how a future
    # bump breaks.
    "genai-prices>=0.1",
    "githubkit[auth-app]>=0.16.0",
    # Direct because bridge.linear talks to Linear's GraphQL API over it. It
    # arrives transitively too, and depending on that is how a future bump breaks.
    "httpx>=0.28",
    "pydantic-ai-slim[openai]>=2.22.0",
]

[dependency-groups]
dev = [
    "prek>=0.4.10",
    "ruff>=0.15.22",
    "ty>=0.0.60",
    "zensical>=0.0.51",
]
